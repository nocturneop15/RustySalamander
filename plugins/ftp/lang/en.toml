# RustySalamander UI strings — the template for translations.
# Generated from the source; copy to <code>.toml, set [language] and translate the values.
# Keys with "|" are plural forms: give as many forms as the language's plural rule has.

[language]
code = "en"
name = "English"
plural = "en"

