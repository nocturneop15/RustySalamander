# Texty doplňku FTP / SFTP v češtině.

[language]
code = "cs"
name = "Čeština"
plural = "cs"

[strings]
"\"{name}\" already exists." = "„{name}“ už existuje."
"\"{name}\" is no longer on the server." = "„{name}“ už na serveru není."
"Active" = "Aktivní"
"An empty port is the protocol's usual one: 22 for SFTP, 21 for FTP and FTPS. With FTP, an empty user name signs in as anonymous. Plain FTP sends the password unencrypted. Automatic data connections try passive mode first and active mode when passive doesn't get through." = "Prázdný port je obvyklý port protokolu: 22 pro SFTP, 21 pro FTP a FTPS. U FTP se bez uživatelského jména přihlásíte jako anonymní uživatel. Obyčejné FTP posílá heslo nešifrované. Automatické datové spojení zkouší nejdřív pasivní režim, a když pasivně neprojde, aktivní."
"Automatic" = "Automatické"
"Cancelled." = "Zrušeno."
"Cannot connect to {server}: {error}" = "Nelze se připojit k {server}: {error}"
"Cannot read the key {file}: {error}" = "Nelze načíst klíč {file}: {error}"
"Choose the private key file." = "Vyberte soubor se soukromým klíčem."
"Connect" = "Připojit"
"Connect to FTP or SFTP server" = "Připojit k serveru FTP nebo SFTP"
"Connect to FTP or SFTP server…" = "Připojit k serveru FTP nebo SFTP…"
"Connections open: {n}" = "Otevřená připojení: {n}"
"Connects to FTP, FTPS (FTP with TLS) and SFTP (SSH) servers and works with their files. Start with Plugins → Connect to FTP or SFTP server…" = "Připojuje se k serverům FTP, FTPS (FTP s TLS) a SFTP (SSH) a pracuje s jejich soubory. Začněte příkazem Doplňky → Připojit k serveru FTP nebo SFTP…"
"Data connection:" = "Datové spojení:"
"Enter a user name." = "Zadejte uživatelské jméno."
"Enter the server's name or address." = "Zadejte název nebo adresu serveru."
"FTP (unencrypted)" = "FTP (nešifrované)"
"FTP / SFTP" = "FTP / SFTP"
"FTPS (FTP with TLS)" = "FTPS (FTP s TLS)"
"Key file:" = "Soubor s klíčem:"
"Key passphrase:" = "Heslo ke klíči:"
"No data connection to the server could be opened ({error}). Choose another data connection mode when connecting." = "Datové spojení se serverem nelze otevřít ({error}). Při připojení zvolte jiný režim datového spojení."
"Not connected to {server}. Connect again: Plugins → Connect to FTP or SFTP server…" = "Spojení s {server} není otevřené. Připojte se znovu: Doplňky → Připojit k serveru FTP nebo SFTP…"
"Passive" = "Pasivní"
"Password" = "Heslo"
"Password:" = "Heslo:"
"Port:" = "Port:"
"Private key" = "Soukromý klíč"
"Protocol:" = "Protokol:"
"SFTP (SSH)" = "SFTP (SSH)"
"Server:" = "Server:"
"Sign in with:" = "Přihlásit pomocí:"
"The certificate of {server} isn't vouched for by a known authority ({reason}). Its SHA-256 fingerprint is\n\n{fingerprint}\n\nCompare it with the fingerprint your server's administrator gives you, and connect only if they match. The certificate is then remembered." = "Za certifikát serveru {server} neručí žádná známá certifikační autorita ({reason}). Jeho otisk SHA-256 je\n\n{fingerprint}\n\nPorovnejte ho s otiskem, který vám dá správce serveru, a připojte se, jen pokud se shodují. Certifikát se pak zapamatuje."
"The connection was lost ({error}). Disconnect and connect again." = "Spojení se přerušilo ({error}). Odpojte se a připojte znovu."
"The key file is protected by a passphrase: enter it." = "Soubor s klíčem je chráněný heslem: zadejte ho."
"The port must be a number from 1 to 65535." = "Port musí být číslo od 1 do 65535."
"The server can't start TLS (FTPS): {error}" = "Server nedokáže zahájit TLS (FTPS): {error}"
"The server didn't accept the key for this user name." = "Server nepřijal klíč pro toto uživatelské jméno."
"The server didn't accept the user name and password." = "Server nepřijal uživatelské jméno a heslo."
"The server didn't accept the user name and password: {error}" = "Server nepřijal uživatelské jméno a heslo: {error}"
"The server didn't answer in time." = "Server neodpověděl včas."
"The server doesn't offer SFTP: {error}" = "Server nenabízí SFTP: {error}"
"The server {server} is not known yet. Its {algorithm} key has the fingerprint\n\n{fingerprint}\n\nCompare it with the fingerprint your server's administrator gives you, and connect only if they match. The key is then remembered." = "Server {server} zatím není známý. Jeho klíč {algorithm} má otisk\n\n{fingerprint}\n\nPorovnejte ho s otiskem, který vám dá správce serveru, a připojte se, jen pokud se shodují. Klíč se pak zapamatuje."
"The server {server} wasn't found." = "Server {server} nebyl nalezen."
"The server's certificate has changed. Disconnect and connect again." = "Certifikát serveru se změnil. Odpojte se a připojte znovu."
"The server's root folder can't be deleted." = "Kořenovou složku serveru nelze smazat."
"The server's root folder can't be used here." = "Kořenovou složku serveru zde nelze použít."
"Trust and connect" = "Důvěřovat a připojit"
"Unknown server" = "Neznámý server"
"User name:" = "Uživatelské jméno:"
"WARNING: the certificate of {server} has changed (it is now {fingerprint}). Someone may be listening in on the connection, or the server got a new certificate. The connection was refused. If the change is expected, remove the server's line from {file}." = "VAROVÁNÍ: certifikát serveru {server} se změnil (teď je {fingerprint}). Spojení může někdo odposlouchávat, nebo server dostal nový certifikát. Připojení bylo odmítnuto. Pokud je změna očekávaná, odstraňte řádek serveru ze souboru {file}."
"WARNING: the key of {server} has changed (it is now {fingerprint}). Someone may be listening in on the connection, or the server was reinstalled. The connection was refused. If the change is expected, remove the server's old key from known_hosts." = "VAROVÁNÍ: klíč serveru {server} se změnil (teď je {fingerprint}). Spojení může někdo odposlouchávat, nebo byl server přeinstalován. Připojení bylo odmítnuto. Pokud je změna očekávaná, odstraňte starý klíč serveru ze souboru known_hosts."
"A name or path on an FTP server can't contain line breaks." = "Název ani cesta na serveru FTP nesmí obsahovat zalomení řádku."
"The password can't contain line breaks." = "Heslo nesmí obsahovat zalomení řádku."
