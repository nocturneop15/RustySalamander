# Texty doplňku Hledání v češtině.

[language]
code = "cs"
name = "Čeština"
plural = "cs"

[strings]
" · could not be read: {n}" = " · nelze přečíst: {n}"
"A regular expression" = "Regulární výraz"
"Cancelled." = "Zrušeno."
"Choose the folder to look in." = "Vyberte složku, ve které se má hledat."
"Containing text:" = "Obsahující text:"
"Done" = "Hotovo"
"Files can't be added to search results." = "Do výsledků hledání nelze přidávat soubory."
"Find" = "Hledat"
"Find \"{text}\" in {names} in {dir}" = "Hledání „{text}“ v {names} ve složce {dir}"
"Find files" = "Hledat soubory"
"Find files…" = "Hledat soubory…"
"Find folders too" = "Hledat i složky"
"Find {names} in {dir}" = "Hledání {names} ve složce {dir}"
"Finds files and folders by name (wildcards or regular expressions) and by the text inside files. Start with Plugins → Find files…" = "Hledá soubory a složky podle názvu (masky nebo regulární výrazy) a podle textu v souborech. Začněte příkazem Doplňky → Hledat soubory…"
"Folders can't be made in search results." = "Ve výsledcích hledání nelze vytvářet složky."
"Include hidden and system items" = "Včetně skrytých a systémových položek"
"Include subfolders" = "Včetně podsložek"
"Leave the text empty to find by name only. Plain text is found in UTF-8, ANSI and UTF-16 files; Match case also applies to a regular expression for names." = "Bez textu se hledá jen podle názvu. Prostý text se najde v souborech UTF-8, ANSI i UTF-16; Rozlišovat velikost písmen platí i pro regulární výraz názvů."
"Look in:" = "Hledat ve složce:"
"Match case" = "Rozlišovat velikost písmen"
"Names are:" = "Názvy jsou:"
"Names:" = "Názvy:"
"Only what was found can be renamed, not the folders leading to it." = "Přejmenovat lze jen nalezené položky, ne složky, které k nim vedou."
"Search" = "Hledání"
"Search results can only be renamed in their own folder." = "Výsledky hledání lze přejmenovat jen v jejich vlastní složce."
"Searching {folder} · found: {found} · files checked: {files}" = "Prohledává se {folder} · nalezeno: {found} · prověřeno souborů: {files}"
"Stopped" = "Zastaveno"
"The name masks can't be read from character {at} on." = "Masky jmen nelze přečíst od znaku {at}."
"The regular expression for names is wrong: {error}" = "Regulární výraz pro názvy je chybný: {error}"
"The regular expression for the text is wrong: {error}" = "Regulární výraz pro text je chybný: {error}"
"The text is a regular expression" = "Text je regulární výraz"
"These search results are closed." = "Tyto výsledky hledání jsou zavřené."
"Wildcards" = "Masky"
"Wildcards: * is any text, ? one character; separate masks with ; and put the ones to leave out after | (*.txt;*.md|old*)." = "Masky: * je libovolný text, ? jeden znak; masky oddělte středníkem a ty, které se mají vynechat, napište za | (*.txt;*.md|old*)."
"Windows could not move the items to the Recycle Bin (error {code})." = "Windows nemohl přesunout položky do Koše (chyba {code})."
"{dir} is not a folder." = "{dir} není složka."
"{name} already exists." = "{name} už existuje."
"{what} · found: {found} · files checked: {files} · folders: {folders} · {seconds} s" = "{what} · nalezeno: {found} · prověřeno souborů: {files} · složek: {folders} · {seconds} s"
