[package]
name = "sal-plugin-search"
description = "RustySalamander plugin: finds files and folders by name (wildcards or regular expressions) and by the text inside them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Installed by the program's build as plugins\search\search.spl.
[lib]
crate-type = ["cdylib"]

[dependencies]
sal-plugin-api = { path = "../../crates/sal-plugin-api" }
regex = "1"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
