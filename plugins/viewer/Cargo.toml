[package]
name = "sal-plugin-viewer"
description = "RustySalamander plugin: the text and hex viewer (F3)"
# the plugin's own version, apart from the program's
version = "0.5.2-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Installed by the program's build as plugins\viewer\viewer.spl.
[lib]
crate-type = ["cdylib"]

[dependencies]
sal-plugin-api = { path = "../../crates/sal-plugin-api" }
sal-core = { path = "../../crates/sal-core" }
sal-ui = { path = "../../crates/sal-ui" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
winit = { version = "0.30", default-features = false }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
