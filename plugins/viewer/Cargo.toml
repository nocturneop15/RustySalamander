[package]
name = "sal-plugin-viewer"
description = "RustySalamander plugin: the text and hex viewer (F3)"
# the plugin's own version, apart from the program's
version = "0.5.8-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Installed by the program's build as plugins\viewer\viewer.spl.
[lib]
crate-type = ["cdylib"]

[dependencies]
sal-plugin-api = { path = "../../crates/sal-plugin-api" }
sal-core = { path = "../../crates/sal-core" }
sal-ui = { path = "../../crates/sal-ui" }
sal-window = { path = "../../crates/sal-window" }
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig", "dump-load"] }
two-face = { version = "0.4", default-features = false, features = ["syntect-onig"] }

[dev-dependencies]
tempfile = "3"
