[package]
name = "sal-plugin-compare"
description = "RustySalamander plugin: compares two files side by side, or two folders in the two panels"
# the plugin's own version, apart from the program's
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Installed by the program's build as plugins\compare\compare.spl.
[lib]
crate-type = ["cdylib"]

[dependencies]
sal-plugin-api = { path = "../../crates/sal-plugin-api" }
sal-core = { path = "../../crates/sal-core" }
sal-ui = { path = "../../crates/sal-ui" }
sal-window = { path = "../../crates/sal-window" }
similar = "2"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3"
