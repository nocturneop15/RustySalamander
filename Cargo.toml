[workspace]
resolver = "2"
members = ["crates/sal-core", "crates/sal-plugin-api", "crates/sal-ui", "crates/sal-window", "crates/sal-soft", "crates/sal-app", "plugins/sevenzip", "plugins/example-filelist", "plugins/scp", "plugins/search", "plugins/viewer", "plugins/compare", "plugins/ftp"]

[workspace.package]
version = "0.9.8-beta"
edition = "2021"
# slice::as_chunks
rust-version = "1.88"
license = "GPL-2.0-or-later"
authors = ["RustySalamander contributors", "Open Salamander Authors (original C++ code)"]

[profile.release]
opt-level = 3
lto = "thin"
# no symbol tables in the shipped exe and plugins (about 25 % smaller)
strip = "symbols"
