[package]
name = "sal-window"
description = "RustySalamander: windows of a plugin's own (the viewer's, the comparison's), shown and drawn by the program"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sal-plugin-api = { path = "../sal-plugin-api" }
sal-ui = { path = "../sal-ui" }
# egui alone: the program draws the windows (no eframe, winit or graphics here)
egui = { version = "0.29", default-features = false, features = ["default_fonts", "serde"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
