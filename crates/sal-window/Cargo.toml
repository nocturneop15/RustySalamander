[package]
name = "sal-window"
description = "RustySalamander: windows of a plugin's own (the viewer's, the comparison's), on a thread and event loop of their own"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sal-plugin-api = { path = "../sal-plugin-api" }
sal-ui = { path = "../sal-ui" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
winit = { version = "0.30", default-features = false }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
