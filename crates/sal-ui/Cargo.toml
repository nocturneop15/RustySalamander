[package]
name = "sal-ui"
description = "RustySalamander: what the program and its plugins' windows share (fonts, scroll bars)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Registry"] }
