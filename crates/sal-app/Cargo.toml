[package]
name = "sal-app"
description = "RustySalamander: dual-pane file manager GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

build = "build.rs"

[[bin]]
name = "rustysalamander"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sal-core = { path = "../sal-core" }
sal-plugin-api = { path = "../sal-plugin-api" }
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
raw-window-handle = "0.6"
serde_json = "1"
flate2 = "1"
semver = "1"

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_UI_Controls_Dialogs", "Win32_Globalization", "Win32_System_Threading", "Win32_Networking_WinHttp"] }
